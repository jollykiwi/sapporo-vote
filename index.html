<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>✈️ Sapporo Vote</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#f0f4ff;min-height:100vh}
.screen{display:none!important}
.screen.active{display:block!important}
#loginScreen.active{display:flex!important;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}
.login-title{color:#fff;font-size:2rem;font-weight:700;margin-bottom:8px;text-align:center}
.login-sub{color:rgba(255,255,255,.8);margin-bottom:32px;text-align:center}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;width:100%;max-width:340px}
.name-btn{padding:16px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:16px;color:#fff;font-size:1.1rem;font-weight:600;cursor:pointer;transition:.2s}
.name-btn:hover,.name-btn.sel{background:rgba(255,255,255,.35);border-color:#fff}
.pin-box{background:rgba(255,255,255,.15);border-radius:16px;padding:20px;width:100%;max-width:340px}
.pin-label{color:rgba(255,255,255,.9);text-align:center;margin-bottom:12px;font-size:.9rem}
.pin-input{width:100%;padding:12px;border-radius:10px;border:none;font-size:1.2rem;text-align:center;letter-spacing:6px;outline:none}
.login-btn{width:100%;max-width:340px;margin-top:12px;padding:14px;background:#fff;color:#764ba2;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}
#topbar{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
#topbar .tname{font-weight:700;font-size:1rem}
#topbar .tday{font-size:.8rem;opacity:.8}
#logoutBtn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.8rem}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8ecf5;position:sticky;top:56px;z-index:99}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-size:.85rem;color:#888;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#667eea;border-bottom-color:#667eea;font-weight:700}
.content{padding:16px;max-width:600px;margin:0 auto}
.sess-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sess-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sess-title{font-weight:700;font-size:1rem;color:#333}
.sess-meta{font-size:.75rem;color:#999}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-food{background:#fff3e0;color:#e65100}
.badge-cafe{background:#f3e5f5;color:#6a1b9a}
.badge-sight{background:#e8f5e9;color:#2e7d32}
.place-item{padding:10px 12px;border-radius:10px;cursor:pointer;border:2px solid #e8ecf5;margin-bottom:6px;transition:.2s;display:flex;align-items:center;justify-content:space-between}
.place-item:hover{border-color:#667eea;background:#f5f7ff}
.place-item.selected{border-color:#667eea;background:#eef0ff}
.place-item .pname{font-weight:600;color:#333;font-size:.9rem}
.place-item .pmeta{font-size:.75rem;color:#888}
.place-item .pcheck{width:20px;height:20px;border-radius:50%;border:2px solid #ccc;flex-shrink:0}
.place-item.selected .pcheck{background:#667eea;border-color:#667eea}
.vote-bar-wrap{margin-top:6px}
.vote-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:.78rem}
.vote-bar-bg{flex:1;background:#e8ecf5;border-radius:4px;height:8px;overflow:hidden}
.vote-bar-fill{background:linear-gradient(90deg,#667eea,#764ba2);height:8px;border-radius:4px;transition:width .5s}
.vote-count{color:#888;min-width:28px;text-align:right}
.voted-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600;background:#e8ecf5;color:#667eea}
.chip.voted{background:#eef0ff;color:#667eea}
.submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:12px}
.change-btn{width:100%;padding:12px;background:#fff;color:#667eea;border:2px solid #667eea;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:12px}
.cancel-btn{width:100%;padding:10px;background:#fff;color:#e53935;border:2px solid #e53935;border-radius:12px;font-size:.85rem;font-weight:600;cursor:pointer;margin-top:8px}
.closed-banner{background:#f5f5f5;border-radius:10px;padding:12px;text-align:center;color:#666;font-size:.85rem;margin-top:8px}
.winner-banner{background:linear-gradient(135deg,#ffeaa7,#fdcb6e);border-radius:10px;padding:12px;text-align:center;margin-top:8px}
.winner-banner .wt{font-size:.8rem;color:#636e72;margin-bottom:4px}
.winner-banner .wn{font-size:1.1rem;font-weight:700;color:#2d3436}
.deadline-tag{font-size:.7rem;color:#e53935;font-weight:600}
.deadline-ok{font-size:.7rem;color:#43a047;font-weight:600}
.status-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.status-title{font-weight:700;color:#333;margin-bottom:12px}
.status-row{margin-bottom:12px}
.status-label{font-size:.85rem;color:#666;margin-bottom:6px}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap}
.emo-btn{padding:8px 12px;border-radius:10px;border:2px solid #e8ecf5;background:#f8f9ff;cursor:pointer;font-size:.9rem;transition:.2s}
.emo-btn.sel{border-color:#667eea;background:#eef0ff}
.save-status-btn{width:100%;padding:12px;background:linear-gradient(135deg,#00b894,#00cec9);color:#fff;border:none;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:12px}
.ai-box{background:linear-gradient(135deg,#dfe6e9,#b2bec3);border-radius:12px;padding:14px;margin-top:12px;font-size:.85rem;color:#2d3436;line-height:1.6}
.ai-box.loaded{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);color:#1b5e20}
.course-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.course-title{font-weight:700;color:#333;margin-bottom:12px;font-size:1rem}
.course-step{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.step-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;margin-top:2px}
.step-body{flex:1}

.step-dist{font-size:.75rem;color:#667eea;margin-top:2px}

.admin-card{background:#fff3e0;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.admin-title{font-weight:700;color:#e65100;margin-bottom:12px;font-size:.9rem}
.admin-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}

.connect-arrow{text-align:center;color:#667eea;font-size:.75rem;padding:4px 0 4px 14px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:.85rem;pointer-events:none;opacity:0;transition:opacity .3s;z-index:9999;white-space:nowrap}
#toast.show{opacity:1}
</style>

function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function distLabel(m,lowEnergy){
  const walk=Math.round(m/70),transit=Math.round(m/250);
  if(m<400) return {label:Math.round(m)+'m',transport:'\uB3C4\uBCF4 '+walk+'\uBD84'};
  if(m<1500){
    const t=lowEnergy?'\uC9C0\uD558\uCCA0/\uBC84\uC2A4 \uAD8C\uC7A5':'\uB3C4\uBCF4 '+walk+'\uBD84';
    return {label:Math.round(m)+'m',transport:t};
  }
  return {label:(m/1000).toFixed(1)+'km',transport:'\uC9C0\uD558\uCCA0/\uBC84\uC2A4 '+transit+'\uBD84\uB300'};
}
function api(path,method,body){
  var opts={method:method||'GET',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  if(method==='POST'||method==='PATCH') opts.headers['Prefer']='return=representation';
  return fetch(SUPA+'/rest/v1/'+path,opts).then(function(r){return r.json();});
}

  });
  document.getElementById('enterBtn').addEventListener('click',doLogin);
  document.getElementById('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  document.getElementById('logoutBtn').addEventListener('click',doLogout);
  document.querySelector('.tabs').addEventListener('click',function(e){
    const tab=e.target.closest('[data-tab]');
    if(tab) switchTab(tab.dataset.tab);
  });
  document.getElementById('saveStatusBtn').addEventListener('click',saveStatus);
  document.getElementById('genCourseBtn').addEventListener('click',genCourse);
  document.getElementById('addPlaceBtn').addEventListener('click',addPlace);
  document.getElementById('addSessBtn').addEventListener('click',addSession);
  document.querySelectorAll('.emo-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      const key=btn.dataset.key;
      document.querySelectorAll('[data-key="'+key+'"]').forEach(function(b){b.classList.remove('sel');});
      btn.classList.add('sel');
      STATUS[key]=parseInt(btn.dataset.val);
    });
  });
  const saved=localStorage.getItem('sv_member');
  if(saved){const m=MEMBERS.find(function(x){return x.id===saved;});if(m){CUR=m;showMain();}}
}
function selectName(m){
  document.querySelectorAll('.name-btn').forEach(function(b){b.classList.remove('sel');});
  const btn=document.querySelector('[data-mid="'+m.id+'"]');
  if(btn) btn.classList.add('sel');
  document.getElementById('pinLabel').textContent=m.name+'\uB2D8\uC758 PIN\uC744 \uC785\uB825\uD558\uC138\uC694';
  window._selMember=m;
  document.getElementById('pinInput').focus();
}
function doLogin(){
  const m=window._selMember;
  if(!m){toast('\uC774\uB984\uC744 \uC120\uD0DD\uD574\uC8FC\uC138\uC694');return;}
  const pin=document.getElementById('pinInput').value;
  if(pin!==m.pin){toast('PIN\uC774 \uB2E4\uB985\uB2C8\uB2E4');return;}
  CUR=m;localStorage.setItem('sv_member',m.id);showMain();
}
function doLogout(){
  localStorage.removeItem('sv_member');CUR=null;
  document.getElementById('pinInput').value='';
  document.querySelectorAll('.name-btn').forEach(function(b){b.classList.remove('sel');});
  document.getElementById('pinLabel').textContent='\uC774\uB984\uC744 \uC120\uD0DD\uD558\uC138\uC694';
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('mainScreen').classList.remove('active');
  if(refreshTimer)clearInterval(refreshTimer);
}
function showMain(){
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  document.getElementById('topName').textContent=CUR.name+' \uB2D8';
  if(CUR.admin) document.getElementById('adminTab').style.display='';
  loadSess();loadTeamStatus();
  refreshTimer=setInterval(loadSess,30000);
}
function switchTab(t){
  document.querySelectorAll('.tab').forEach(function(el){el.classList.remove('active');});
  const activeTab=document.querySelector('[data-tab="'+t+'"]');
  if(activeTab) activeTab.classList.add('active');
  ['vote','status','course','admin'].forEach(function(id){
    const el=document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1));
    if(el) el.style.display=(id===t?'':'none');
  });
  if(t==='admin') loadAdminSessions();
  if(t==='status') loadTeamStatus();
}
function loadSess(){
  return Promise.all([
    api('vote_sessions?order=day_number,meal_time&select=*'),
    api('places?order=category,name'),
    api('votes?select=*')
  ]).then(function(results){
    if(!Array.isArray(results[0])||!Array.isArray(results[1])){
      document.getElementById('swrap').innerHTML='<p style="color:#999;padding:16px;text-align:center">\uB85C\uB4DC \uC2E4\uD328 - \uC7A0\uC2DC \uD6C4 \uC2DC\uB3C4\uD574\uC8FC\uC138\uC694</p>';
      return;
    }
    SESSIONS=results[0];PLACES=results[1];
    VOTES={};
    (results[2]||[]).forEach(function(v){
      if(!VOTES[v.session_id])VOTES[v.session_id]=[];
      VOTES[v.session_id].push(v);
    });
    renderSessions();
  }).catch(function(e){
    document.getElementById('swrap').innerHTML='<p style="color:red;padding:16px">\uB85C\uB4DC \uC2E4\uD328: '+e.message+'</p>';
  });
}
function renderSessions(){
  const wrap=document.getElementById('swrap');
  if(!SESSIONS.length){wrap.innerHTML='<p style="color:#999;padding:16px;text-align:center">\uC0DD\uC131\uB41C \uD22C\uD45C \uC138\uC158\uC774 \uC5C6\uC5B4\uC694</p>';return;}
  var html='';var lastDay=null;
  SESSIONS.forEach(function(sess){
    if(sess.day_number!==lastDay){
      html+='<div class="section-title">Day '+sess.day_number+'</div>';
      lastDay=sess.day_number;
    }
    const sv=VOTES[sess.id]||[];
    const myVote=sv.find(function(v){return v.member_id===CUR.id;});
    const now=new Date(),dl=new Date(sess.deadline);
    const open=!sess.is_closed&&now<dl;
    const catClass=CE[sess.category]||'badge-food';
    const catLabel=CL[sess.category]||sess.category;
    const timeLabel=TL[sess.meal_time]||sess.meal_time;
    const dlStr=dl.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    html+='<div class="sess-card" data-sid="'+sess.id+'">';
    html+='<div class="sess-header"><div>';
    html+='<div class="sess-title">Day'+sess.day_number+' '+timeLabel+' <span class="badge '+catClass+'">'+catLabel+'</span></div>';
    if(sess.is_closed){html+='<div class="deadline-tag">\uD22C\uD45C \uC885\uB8CC</div>';}
    else if(now>dl){html+='<div class="deadline-tag">\uB9C8\uAC10 \uB3FC\uC74C</div>';}
    else{html+='<div class="deadline-ok">~'+dlStr+' \uC9C4\uD589 \uC911</div>';}
    html+='</div><div class="sess-meta">'+sv.length+'/4\uD45C</div></div>';
    html+='<div class="voted-chips">';
    MEMBERS.forEach(function(mem){
      const v=sv.find(function(vv){return vv.member_id===mem.id;});
      html+='<span class="chip'+(v?' voted':'')+'">'+( v?'V ':'-')+mem.name+'</span>';
    });
    html+='</div>';
    if(sess.is_closed&&sess.winning_place_id){
      const wp=PLACES.find(function(p){return p.id===sess.winning_place_id;});
      html+='<div class="winner-banner"><div class="wt">\uC120\uD0DD\uB41C \uC7A5\uC18C</div><div class="wn">'+(wp?wp.name_kr:'-')+'</div></div>';
    }
    const sp=PLACES.filter(function(p){return p.category===sess.category;});
    html+='<div class="place-list" style="margin-top:10px">';
    sp.forEach(function(p){
      const pv=sv.filter(function(v){return v.place_id===p.id;});
      const pct=sv.length>0?Math.round(pv.length/sv.length*100):0;
      const isMine=myVote&&myVote.place_id===p.id;
      const isSel=SEL[sess.id]===p.id;
      html+='<div class="place-item'+(isMine||isSel?' selected':'')+'" data-sid="'+sess.id+'" data-pid="'+p.id+'">';
      html+='<div><div class="pname">'+p.name_kr+'</div>';
      html+='<div class="pmeta">'+p.sub_category+' - '+p.price_range+'</div>';
      html+='<div class="vote-bar-wrap"><div class="vote-bar-row">';
      html+='<div class="vote-bar-bg"><div class="vote-bar-fill" style="width:'+pct+'%"></div></div>';
      html+='<span class="vote-count">'+pv.length+'\uD45C</span>';
      if(pv.length>0){
        const who=pv.map(function(v){const m=MEMBERS.find(function(x){return x.id===v.member_id;});return m?m.name:'?';}).join(', ');
        html+='<span style="font-size:.7rem;color:#888">'+who+'</span>';
      }
      html+='</div></div></div>';
      html+='<div class="pcheck'+(isMine||isSel?' selected':'')+'"></div>';
      html+='</div>';
    });
    html+='</div>';
    if(open&&!myVote){html+='<button class="submit-btn" data-sid="'+sess.id+'">\uD22C\uD45C \uC81C\uCD9C\uD558\uAE30</button>';}
    else if(open&&myVote){
      html+='<button class="change-btn" data-sid="'+sess.id+'">\uD22C\uD45C \uBCC0\uACBD\uD558\uAE30</button>';
      html+='<button class="cancel-btn" data-sid="'+sess.id+'" data-vid="'+myVote.id+'">\uD22C\uD45C \uCDE8\uC18C</button>';
    }
    else if(!open&&!sess.is_closed){html+='<div class="closed-banner">\uB9C8\uAC10\uB41C \uD22C\uD45C</div>';}
    html+='</div>';
  });
  wrap.innerHTML=html;
  wrap.querySelectorAll('.place-item').forEach(function(el){
    el.addEventListener('click',function(){
      const sid=el.dataset.sid,pid=el.dataset.pid;
      const sess=SESSIONS.find(function(s){return s.id===sid;});
      if(!sess) return;
      const sv=VOTES[sid]||[];
      const myVote=sv.find(function(v){return v.member_id===CUR.id;});
      if(sess.is_closed||new Date()>=new Date(sess.deadline)||myVote) return;
      SEL[sid]=pid;renderSessions();
    });
  });
  wrap.querySelectorAll('.submit-btn').forEach(function(btn){
    btn.addEventListener('click',function(){submitVote(btn.dataset.sid);});
  });
  wrap.querySelectorAll('.change-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      const sid=btn.dataset.sid;
      const sv=VOTES[sid]||[];
      const myVote=sv.find(function(v){return v.member_id===CUR.id;});
      if(myVote){
        fetch(SUPA+'/rest/v1/votes?id=eq.'+myVote.id,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
        .then(function(){delete SEL[sid];toast('\uBCC0\uACBD \uBAA8\uB4DC');loadSess();});
      }
    });
  });
  wrap.querySelectorAll('.cancel-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      fetch(SUPA+'/rest/v1/votes?id=eq.'+btn.dataset.vid,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
      .then(function(){toast('\uD22C\uD45C \uCDE8\uC18C');loadSess();});
    });
  });
}
function submitVote(sid){
  const pid=SEL[sid];
  if(!pid){toast('\uC7A5\uC18C\uB97C \uC120\uD0DD\uD574\uC8FC\uC138\uC694');return;}
  fetch(SUPA+'/rest/v1/votes',{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify({session_id:sid,member_id:CUR.id,place_id:pid})
  }).then(function(){delete SEL[sid];toast('\uD22C\uD45C \uC644\uB8CC!');loadSess();});
}
function saveStatus(){
  if(STATUS.energy===null||STATUS.hunger===null||STATUS.will===null){
    toast('\uBAA8\uB4E0 \uD56D\uBAA9 \uC120\uD0DD');return;
  }
  fetch(SUPA+'/rest/v1/status_checks',{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify({member_id:CUR.id,energy:STATUS.energy,hunger:STATUS.hunger,will_to_go:STATUS.will,timestamp:new Date().toISOString()})
  }).then(function(){toast('\uC0C1\uD0DC \uC800\uC7A5!');updateAI();loadTeamStatus();});
}

  } else if(h>=100){
    msg='\uBC30\uACE0\uD30C\uC8FD! \uC9C0\uAE08 \uBC14\uB85C \uC2DD\uC0AC\uBD80\uD130 \uAC00\uC2DC\uB294 \uAC8C \uC81C\uC77C \uC911\uC694\uD574\uC694.';
  } else if(e>=80&&w>=80){
    msg='\uCCB4\uB825\uB3C4 \uB118\uCE58\uACE0 \uC758\uC9C0\uB3C4 \uD3FC\uD3FC! \uAC01\uD50C\uC774 \uC774\uB3D9\uD574\uB3C4 \uC88B\uC544\uC694.';
  } else if(e<=30&&w>=60){
    msg='\uC0B4\uC9DD \uD588\uC9C0\uB9CC \uB098\uAC00\uACE0 \uC2F6\uC73C\uC2DC\uAD70\uC694! \uAC00\uAE4C\uC6B4 \uC9C0\uD558\uCCA0\uC5ED \uC774\uB3D9 \uCF54\uC2A4\uB97C \uCD94\uCC9C\uD574\uB4DC\uB9B4\uAC8C\uC694.';
  } else if((e+h+w)/3>=60){
    msg='\uACE0\uB8E8 \uC55E\uAC8C \uB098\uAC00 \uBD10\uC694! \uB3C4\uBCF4 \uC704\uC8FC \uCF54\uC2A4 \uC5B4\uB5A8\uAC00\uC694?';
  } else {
    msg='\uD0C0\uB204\uD0A4 \uCF54\uC9C0 \uC1FC\uD551\uC774\uB098 \uC624\uB3C4\uB9AC \uC0B0\uCC45\uCC98\uB7FC \uBE44\uAD50\uC801 \uD3B8\uD55C \uC77C\uC815 \uAD8C\uC7A5!';
  }
  box.textContent=msg;box.classList.add('loaded');
}
function loadTeamStatus(){
  api('status_checks?order=timestamp.desc&limit=20').then(function(data){
    const latest={};
    data.forEach(function(s){if(!latest[s.member_id])latest[s.member_id]=s;});
    const wrap=document.getElementById('teamStatusWrap');
    if(!Object.keys(latest).length){wrap.innerHTML='<p style="color:#999;font-size:.85rem">\uC544\uC9C1 \uC0C1\uD0DC \uC815\uBCF4\uAC00 \uC5C6\uC5B4\uC694</p>';return;}
    var html='';
    MEMBERS.forEach(function(m){
      const s=latest[m.id];if(!s)return;
      const e=s.energy,h=s.hunger,w=s.will_to_go;
      const eIcon=e>=80?'[\uC88B\uC74C]':e>=50?'[\uBCF4\uD1B5]':'[\uD658\uC7A5]';
      html+='<div class="team-status-row">';
      html+='<span style="font-weight:700;min-width:52px;font-size:.85rem">'+m.name+'</span>';
      html+='<span style="font-size:.75rem;color:#555">\uCCB4\uB825 '+eIcon+'</span>';
      html+='<span style="font-size:.75rem;color:#555">\uBC30\uACE0\uD30C\uC9D1: '+h+'</span>';
      html+='<span style="font-size:.75rem;color:#555">\uC758\uC9C0: '+w+'</span>';
      html+='</div>';
    });
    wrap.innerHTML=html;
  }).catch(function(){});
}
function genCourse(){
  const result=document.getElementById('courseResult');
  result.innerHTML='<p style="color:#999;font-size:.85rem">\uC0DD\uC131 \uC911...</p>';
  api('status_checks?order=timestamp.desc&limit=20').then(function(statusData){
    const latest={};
    (Array.isArray(statusData)?statusData:[]).forEach(function(s){if(!latest[s.member_id])latest[s.member_id]=s;});
    const ms=Object.values(latest);
    const teamAvg={
      energy:ms.length?Math.round(ms.reduce(function(a,s){return a+s.energy;},0)/ms.length):60,
      hunger:ms.length?Math.round(ms.reduce(function(a,s){return a+s.hunger;},0)/ms.length):60,
      will:ms.length?Math.round(ms.reduce(function(a,s){return a+(s.will_to_go||60);},0)/ms.length):60
    };
    const lowE=teamAvg.energy<50;
    const closedS=SESSIONS.filter(function(s){return s.is_closed&&s.winning_place_id;});
    const openS=SESSIONS.filter(function(s){return !s.is_closed;});
    const courseItems=[];
    closedS.forEach(function(sess){
      const place=PLACES.find(function(p){return p.id===sess.winning_place_id;});
      if(place) courseItems.push({sess:sess,place:place,decided:true});
    });
    openS.forEach(function(sess){
      const sv=VOTES[sess.id]||[];
      if(sv.length>0){
        var counts={};
        sv.forEach(function(v){counts[v.place_id]=(counts[v.place_id]||0)+1;});
        var topId=Object.entries(counts).sort(function(a,b){return b[1]-a[1];})[0][0];
        const place=PLACES.find(function(p){return p.id===topId;});
        if(place) courseItems.push({sess:sess,place:place,decided:false});
      }
    });
    const timeOrder={morning:0,lunch:1,cafe:2,dinner:3,free:4};
    courseItems.sort(function(a,b){
      if(a.sess.day_number!==b.sess.day_number) return a.sess.day_number-b.sess.day_number;
      return (timeOrder[a.sess.meal_time]||5)-(timeOrder[b.sess.meal_time]||5);
    });
    if(!courseItems.length){
      result.innerHTML='<p style="color:#999;font-size:.85rem;text-align:center">\uD22C\uD45C \uACB0\uACFC\uAC00 \uC5C6\uC5B4\uC694. \uBA3C\uC800 \uD22C\uD45C\uD574\uBCF4\uC138\uC694!</p>';
      return;
    }
    var html='';
    html+='<div style="background:#f8f9ff;border-radius:10px;padding:12px;margin-bottom:16px;font-size:.8rem;color:#555">';
    html+='<b>\uD300 \uD3C9\uADE0</b>  \uCCB4\uB825 '+teamAvg.energy+'%  \uBC30\uACE0\uD30C\uC9D1 '+teamAvg.hunger+'%  \uC758\uC9C0 '+teamAvg.will+'%';
    if(teamAvg.energy<30||teamAvg.will<30){
      html+='<br><span style="color:#e53935;font-weight:600">\uD300 \uCCB4\uB825\uC774 \uB099\uC544\uC694. \uAC00\uAE4C\uC6B4 \uCF54\uC2A4 \uAD8C\uC7A5</span>';
    } else if(teamAvg.energy>=80&&teamAvg.will>=70){
      html+='<br><span style="color:#43a047;font-weight:600">\uD300 \uCCB4\uB825 \uCD5C\uC0C1! \uC801\uADF9\uC801\uC778 \uCF54\uC2A4 \uC989\uAE30\uC138\uC694</span>';
    }
    html+='</div>';
    var lastLat=null,lastLng=null,lastDay=null;
    courseItems.forEach(function(item,i){
      if(item.sess.day_number!==lastDay){
        html+='<div class="section-title" style="margin-top:'+(i>0?'16':'4')+'px">Day '+item.sess.day_number+'</div>';
        lastDay=item.sess.day_number;lastLat=null;lastLng=null;
      }
      const coords=PLACE_COORDS[item.place.id];
      var distHtml='';
      if(lastLat!==null&&coords){
        const dist=haversine(lastLat,lastLng,coords[0],coords[1]);
        const dl=distLabel(dist,lowE);
        distHtml='<div class="step-dist">&#8594; '+dl.label+'</div><div class="step-transport">'+dl.transport+'</div>';
      }
      if(coords){lastLat=coords[0];lastLng=coords[1];}
      const timeLabel=TL[item.sess.meal_time]||item.sess.meal_time;
      const catClass=CE[item.place.category]||'badge-food';
      const catLabel=CL[item.place.category]||item.place.category;
      const decLabel=item.decided
        ?'<span style="font-size:.7rem;color:#43a047;font-weight:700">&#10003; \uD655\uC815</span>'
        :'<span style="font-size:.7rem;color:#f39c12;font-weight:700">(\uD22C\uD45C \uC9C4\uD589 \uC911)</span>';
      html+='<div class="course-step">';
      html+='<div class="step-num">'+(i+1)+'</div>';
      html+='<div class="step-body">';
      html+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
      html+='<span class="step-name">'+item.place.name_kr+'</span>';
      html+='<span class="badge '+catClass+'">'+catLabel+'</span>';
      html+='<span style="font-size:.72rem;color:#888">'+timeLabel+'</span>'+decLabel;
      html+='</div>';
      html+='<div style="font-size:.75rem;color:#888;margin-top:2px">'+item.place.price_range+'</div>';
      if(distHtml) html+=distHtml;
      html+='</div></div>';
    });
    html+='<div style="background:#e8f5e9;border-radius:10px;padding:12px;margin-top:16px;font-size:.82rem;color:#1b5e20;line-height:1.7">';
    if(teamAvg.energy<40){
      html+='\uCCB4\uB825 \uBD80\uC871. \uC7A5\uC18C \uAC04 \uC774\uB3D9\uC740 \uAC00\uAE09\uC801 \uB300\uC911\uAD50\uD1B5 \uC774\uC6A9\uD558\uC138\uC694.';
    } else if(teamAvg.energy>=70){
      html+='\uCCB4\uB825 \uCDA9\uBD84! \uAC70\uB9AC\uAC00 \uBA3C \uACF3\uB3C4 \uB3C4\uBCF4\uB85C \uC774\uB3D9 \uAC00\uB2A5.';
    } else {
      html+='\uC801\uB2F9\uD55C \uCCB4\uB825. 1.5km \uC774\uC0C1 \uAC70\uB9AC\uB294 \uB300\uC911\uAD50\uD1B5\uC744 \uD65C\uC6A9\uD558\uC138\uC694.';
    }
    html+='</div>';
    result.innerHTML=html;
  }).catch(function(e){
    result.innerHTML='<p style="color:red">\uC624\uB958: '+e.message+'</p>';
  });
}
function addPlace(){
  const name=document.getElementById('newPlaceName').value.trim();
  const cat=document.getElementById('newPlaceCat').value;
  const sub=document.getElementById('newPlaceSub').value.trim();
  const price=document.getElementById('newPlacePrice').value.trim();
  const desc=document.getElementById('newPlaceDesc').value.trim();
  const lat=parseFloat(document.getElementById('newPlaceLat').value)||null;
  const lng=parseFloat(document.getElementById('newPlaceLng').value)||null;
  if(!name){toast('\uC7A5\uC18C \uC774\uB984 \uC785\uB825 \uD544\uC694');return;}
  fetch(SUPA+'/rest/v1/places',{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({name:name,name_kr:name,category:cat,sub_category:sub||cat,price_range:price||'-',description:desc||name})
  }).then(function(r){return r.json();}).then(function(d){
    if(d&&d[0]){
      if(lat&&lng) PLACE_COORDS[d[0].id]=[lat,lng];
      toast('\uCD94\uAC00: '+name);
      ['newPlaceName','newPlaceSub','newPlacePrice','newPlaceDesc','newPlaceLat','newPlaceLng'].forEach(function(id){
        document.getElementById(id).value='';
      });
      loadSess();
    } else {toast('\uCD94\uAC00 \uC2E4\uD328');}
  }).catch(function(e){toast('\uC624\uB958: '+e.message);});
}
function addSession(){
  const day=parseInt(document.getElementById('newSessDay').value);
  const time=document.getElementById('newSessTime').value;
  const cat=document.getElementById('newSessCat').value;
  const dl=document.getElementById('newSessDeadline').value;
  if(!dl){toast('\uB9C8\uAC10 \uC2DC\uAC04 \uD544\uC694');return;}
  fetch(SUPA+'/rest/v1/vote_sessions',{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({day_number:day,meal_time:time,category:cat,deadline:new Date(dl).toISOString(),is_closed:false})
  }).then(function(){toast('\uC138\uC158 \uC0DD\uC131 \uC644\uB8CC!');loadSess();loadAdminSessions();});
}
function loadAdminSessions(){
  fetch(SUPA+'/rest/v1/vote_sessions?order=day_number,meal_time',{
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}
  }).then(function(r){return r.json();}).then(function(sessions){
    if(!Array.isArray(sessions)){document.getElementById('adminSessWrap').innerHTML='';return;}
    var html='<div class="admin-card"><div class="admin-title">\uC138\uC158 \uAD00\uB9AC</div>';
    sessions.forEach(function(sess){
      const dl=new Date(sess.deadline).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      const catLabel=CL[sess.category]||sess.category;
      const timeLabel=TL[sess.meal_time]||sess.meal_time;
      html+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ffe0cc;flex-wrap:wrap">';
      html+='<span style="font-size:.82rem;flex:1">Day'+sess.day_number+' '+timeLabel+' '+catLabel+' ~'+dl+'</span>';
      if(!sess.is_closed){html+='<button class="admin-btn" onclick="closeSession(\"'+sess.id+'\")">\uB9C8\uAC10</button>';}
      else{html+='<span style="font-size:.75rem;color:#999">\uC885\uB8CC</span>';}
      html+='<button class="admin-btn danger" onclick="deleteSession(\"'+sess.id+'\")">\uC0AD\uC81C</button>';
      html+='</div>';
    });
    html+='</div>';
    document.getElementById('adminSessWrap').innerHTML=html;
  });
}
function closeSession(sid){
  const sv=VOTES[sid]||[];
  var winnerId=null;
  if(sv.length>0){
    var counts={};
    sv.forEach(function(v){counts[v.place_id]=(counts[v.place_id]||0)+1;});
    winnerId=Object.entries(counts).sort(function(a,b){return b[1]-a[1];})[0][0];
  }
  const body=Object.assign({is_closed:true},winnerId?{winning_place_id:winnerId}:{});
  fetch(SUPA+'/rest/v1/vote_sessions?id=eq.'+sid,{
    method:'PATCH',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(){toast('\uC138\uC158 \uB9C8\uAC10!');loadSess();loadAdminSessions();});
}
function deleteSession(sid){
  if(!window.confirm('\uC0AD\uC81C\uD558\uACA0\uC5B4\uC694?')) return;
  fetch(SUPA+'/rest/v1/votes?session_id=eq.'+sid,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
  .then(function(){
    return fetch(SUPA+'/rest/v1/vote_sessions?id=eq.'+sid,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
  }).then(function(){toast('\uC0AD\uC81C \uC644\uB8CC');loadSess();loadAdminSessions();});
}
document.addEventListener('DOMContentLoaded',initLogin);
</script>
